<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><rect width="960" height="470" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#007f86"/></marker></defs><g stroke="#007f86" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M245 108V168"/><path d="M245 250V315"/><path d="M440 210H530"/><path d="M440 357H530"/></g><rect x="50" y="25" width="390" height="82" rx="10" fill="#eff5f8" stroke="#d7e2e9"/><text x="70" y="55" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#102b46">Validate alert and isolate</text><text x="70" y="82" font-family="Arial,sans-serif" font-size="17" fill="#24364a">Preserve evidence and device identity</text><rect x="50" y="168" width="390" height="82" rx="10" fill="#eff5f8" stroke="#d7e2e9"/><text x="70" y="198" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#102b46">Containment verified?</text><text x="70" y="225" font-family="Arial,sans-serif" font-size="17" fill="#24364a">Check every active network path</text><rect x="530" y="168" width="390" height="82" rx="10" fill="#eff5f8" stroke="#d7e2e9"/><text x="550" y="198" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#102b46">No or uncertain</text><text x="550" y="225" font-family="Arial,sans-serif" font-size="17" fill="#24364a">Maintain isolation and investigate</text><rect x="50" y="315" width="390" height="82" rx="10" fill="#eff5f8" stroke="#d7e2e9"/><text x="70" y="345" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#102b46">Recovery checks pass?</text><text x="70" y="372" font-family="Arial,sans-serif" font-size="17" fill="#24364a">Trusted restore, updates, credentials</text><rect x="530" y="315" width="390" height="82" rx="10" fill="#eff5f8" stroke="#d7e2e9"/><text x="550" y="345" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#102b46">Yes: approve reconnection</text><text x="550" y="372" font-family="Arial,sans-serif" font-size="17" fill="#24364a">Monitor and retain closure evidence</text><text x="265" y="288" font-family="Arial" font-size="16" fill="#007f86">Yes</text><text x="50" y="442" font-family="Arial" font-size="17" fill="#526577">If recovery checks fail, remain isolated. Proposed workflow; not an executed response.</text></svg>